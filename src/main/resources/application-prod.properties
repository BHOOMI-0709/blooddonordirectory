# Production profile: SPRING_PROFILES_ACTIVE=prod
# Neeche ke saare values environment variables se aate hain. Koi missing hoga to app start hote hi clear error dega.

# Example DB_URL: jdbc:postgresql://HOST:5432/DBNAME?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# Production me default key nahi chalega - ADMIN_KEY set karna padega
app.admin-key=${ADMIN_KEY}
app.seed-demo-data=${SEED_DEMO:false}
