# ===== Server =====
# Render/Railway jaise hosts PORT env variable dete hain; local pe 8080
server.port=${PORT:8080}

# ===== Database (local default: H2 file database, data ./data folder me save hota hai) =====
spring.datasource.url=jdbc:h2:file:./data/blooddb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# Tables apne aap ban/update ho jayengi
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ===== App settings =====
# Admin key: delete/edit/fulfil jaise actions ke liye. Production me ZAROOR badlo (ADMIN_KEY env variable)
app.admin-key=${ADMIN_KEY:admin123}

# Frontend alag jagah host karo to uska URL yahan (comma separated). Same server pe ho to "*" chalega
app.cors-allowed-origins=${CORS_ORIGINS:*}

# Pehli baar start pe demo donors daalna (production me false rakho)
app.seed-demo-data=${SEED_DEMO:true}
